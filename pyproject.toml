[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-serve"
version = "0.2.0"
authors = [{ name = "SparkSnail" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
description = "Kubernetes control plane for disaggregated LLM serving with PD scheduling and KV-affinity routing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "nats-py>=2.7,<3",
    "prometheus-client>=0.20,<1",
    "xxhash>=3,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
harness = [
    "transformers>=4.51,<5",
]
# The in-process adapter is only used by local CPU integration tests. The
# production control plane talks to prism-infer over HTTP and does not import
# the GPU engine at install or startup time.
infer = [
    "prism-infer @ git+https://github.com/SparkSnail/prism-infer.git@main",
]

[project.urls]
Homepage = "https://github.com/SparkSnail/prism-serve"

[project.scripts]
prism-serve = "prism_serve.gateway.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prism_serve*"]
