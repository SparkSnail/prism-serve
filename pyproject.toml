[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-serve"
version = "0.1.0"
authors = [{ name = "SparkSnail" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
description = "Kubernetes control plane for disaggregated LLM serving: KV-affinity routing, predictive autoscaling, stateful rescale"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "nats-py>=2.7",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/SparkSnail/prism-serve"

[project.scripts]
prism-serve = "prism_serve.gateway.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prism_serve*"]
