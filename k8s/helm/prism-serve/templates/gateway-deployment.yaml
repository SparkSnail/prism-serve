apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prism-serve.fullname" . }}-gateway
  labels:
    {{- include "prism-serve.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "prism-serve.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prism-serve.gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "prism-serve.gateway.image" . }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command: ["prism-serve"]
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            - name: PRISM_SERVE_PORT
              value: {{ .Values.gateway.port | quote }}
            - name: PRISM_SERVE_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: PRISM_SERVE_NATS_URL
              value: {{ .Values.nats.url | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
